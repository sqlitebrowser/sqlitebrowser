name: Build (Windows)

on:
  workflow_call:
    inputs:
      NIGHTLY:
        default: false
        type: boolean
      CONSOLIDATE_DEPENDENCY_SUMMARY:
        default: false
        type: boolean
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        arch: [x86, x64]
        os: [windows-2022]
    env:
      GH_TOKEN: ${{ github.token }}
      ICU_VERSION: "78.3"
      OPENSSL_INCLUDE_DIR: C:\dev\OpenSSL\include
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          choco install --no-progress ninja

          cd $env:GITHUB_WORKSPACE/tools/windows/
          python -m pip install --disable-pip-version-check -r requirements/download_latest_openssl3.txt
          $OpenSSLInstallerFileName = (python download_latest_openssl3.py).Trim()
          Start-Process -FilePath ".\$OpenSSLInstallerFileName" -ArgumentList '/ALLUSERS /verysilent /dir="C:\dev\OpenSSL"' -Wait

      - name: Resolve OpenSSL library directory
        run: |
          if ("${{ matrix.arch }}" -eq "x86") {
            $OpenSSLLibCandidates = @("x86", "Win32")
          } elseif ("${{ matrix.arch }}" -eq "x64") {
            $OpenSSLLibCandidates = @("x64", "Win64A")
          } else {
            $OpenSSLLibCandidates = @("${{ matrix.arch }}")
          }

          $OpenSSLLibArch = $null
          foreach ($Candidate in $OpenSSLLibCandidates) {
            if ((Test-Path "C:\dev\OpenSSL\lib\VC\$Candidate\MD\libcrypto.lib") -and (Test-Path "C:\dev\OpenSSL\lib\VC\$Candidate\MD\libssl.lib")) {
              $OpenSSLLibArch = $Candidate
              break
            }
          }

          if ($null -eq $OpenSSLLibArch) {
            throw "Could not locate OpenSSL libraries for architecture '${{ matrix.arch }}'"
          }

          "OPENSSL_LIB_ARCH=$OpenSSLLibArch" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          arch: ${{ matrix.arch == 'x86' && 'win32_msvc2019' || matrix.arch == 'x64' && 'win64_msvc2019_64'}}
          cache: true
          cache-key-prefix: "cache"
          version: 5.15.2

      - name: Install VS2019
        run: choco install visualstudio2019community --package-parameters "--add Microsoft.VisualStudio.Component.VC.Tools.x86.x64 --add Microsoft.VisualStudio.Component.Windows10SDK.19041"

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch == 'x86' && 'amd64_x86' || matrix.arch == 'x64' && 'amd64'}}
          vsversion: 2019

      - name: Download ICU
        run: |
          $ICUArch = if ("${{ matrix.arch }}" -eq "x86") { "Win32" } else { "Win64" }
          $ICUArchiveFileName = "icu4c-$env:ICU_VERSION-$ICUArch-MSVC2022.zip"
          gh release download "release-$env:ICU_VERSION" --pattern $ICUArchiveFileName --pattern "SHASUM512.txt" --repo "unicode-org/icu"
          $ExpectedHash = ((Select-String -Path SHASUM512.txt -Pattern "\*$([regex]::Escape($ICUArchiveFileName))$").Line -split '\s+')[0]
          if (-not $ExpectedHash -or (Get-FileHash -Algorithm SHA512 $ICUArchiveFileName).Hash -ne $ExpectedHash) {
            throw "ICU archive checksum mismatch."
          }

          Expand-Archive -Path $ICUArchiveFileName -DestinationPath C:\dev\ICU
          # Normalize the architecture-specific directory names (e.g. bin64, lib64) to bin and lib.
          Get-ChildItem C:\dev\ICU -Directory -Filter "bin*" | Where-Object Name -ne "bin" | Rename-Item -NewName bin
          Get-ChildItem C:\dev\ICU -Directory -Filter "lib*" | Where-Object Name -ne "lib" | Rename-Item -NewName lib
          "C:\dev\ICU\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "ICUMajorVersion=$($env:ICU_VERSION.Split('.')[0])" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build SQLite
        run: |
          Set-Location "${{ github.workspace }}\tools\windows"
          $SQLiteArchiveFileName = (python download_latest_sqlite.py).Trim()
          Expand-Archive -Path $SQLiteArchiveFileName -DestinationPath C:\dev\
          Move-Item -Path C:\dev\sqlite-amalgamation-* C:\dev\SQLite\
          cd C:\dev\SQLite
          cl sqlite3.c -DSQLITE_ENABLE_FTS5 -DSQLITE_ENABLE_FTS3 -DSQLITE_ENABLE_FTS3_PARENTHESIS -DSQLITE_ENABLE_STAT4 -DSQLITE_SOUNDEX -DSQLITE_ENABLE_JSON1 -DSQLITE_ENABLE_GEOPOLY -DSQLITE_ENABLE_RTREE -DSQLITE_ENABLE_MATH_FUNCTIONS -DSQLITE_ENABLE_ICU -DSQLITE_MAX_ATTACHED=125 -DSQLITE_API="__declspec(dllexport)" -IC:\dev\ICU\include -link -dll -out:sqlite3.dll /LIBPATH:C:\dev\ICU\lib icuuc.lib icuin.lib

      - name: Download SQLean extension
        run: |
          if ("${{ matrix.arch }}" -eq "x86") {
            # sqlean has discontinued x86 support starting from v0.28.0
            gh release download 0.27.4 --pattern "sqlean-win-x86.zip" --repo "nalgeon/sqlean"
            Expand-Archive -Path sqlean-win-x86.zip -DestinationPath .\sqlean
          } else {
            gh release download --pattern "sqlean-win-x64.zip" --repo "nalgeon/sqlean"
            Expand-Archive -Path sqlean-win-x64.zip -DestinationPath .\sqlean
          }

      - name: Build 'formats' Extensions
        run: |
          cp .\src\extensions\extension-formats.c C:\dev\SQLite\
          cp .\src\extensions\extension-formats.def C:\dev\SQLite\
          cd C:\dev\SQLite
          cl /MD extension-formats.c -link -dll -def:extension-formats.def -out:formats.dll

      - name: Build SQLCipher
        run: |
          git clone https://www.github.com/sqlcipher/sqlcipher C:\dev\SQLCipher
          cd C:\dev\SQLCipher
          git checkout $(git describe --tags --abbrev=0)
          if ("${{ matrix.arch }}" -eq "x86") {
            nmake /f Makefile.msc sqlcipher.dll USE_AMALGAMATION=1 NO_TCL=1 USE_ICU=1 ICUDIR=C:\dev\ICU SQLITE3DLL=sqlcipher.dll SQLITE3LIB=sqlcipher.lib SQLITE3EXE=sqlcipher.exe LTLINKOPTS="C:\dev\OpenSSL\lib\VC\x86\MD\libcrypto.lib" OPT_FEATURE_FLAGS="-DSQLITE_EXTRA_INIT=sqlcipher_extra_init -DSQLITE_EXTRA_SHUTDOWN=sqlcipher_extra_shutdown -DSQLITE_TEMP_STORE=2 -DSQLITE_HAS_CODEC=1 -DSQLITE_ENABLE_FTS3=1 -DSQLITE_ENABLE_FTS5=1 -DSQLITE_ENABLE_FTS3_PARENTHESIS=1 -DSQLITE_ENABLE_STAT4=1 -DSQLITE_SOUNDEX=1 -DSQLITE_ENABLE_JSON1=1 -DSQLITE_ENABLE_GEOPOLY=1 -DSQLITE_ENABLE_RTREE=1 -DSQLCIPHER_CRYPTO_OPENSSL=1 -DSQLITE_MAX_ATTACHED=125 -IC:\dev\OpenSSL\include\x86"
          } else {
            nmake /f Makefile.msc sqlcipher.dll USE_AMALGAMATION=1 NO_TCL=1 USE_ICU=1 ICUDIR=C:\dev\ICU SQLITE3DLL=sqlcipher.dll SQLITE3LIB=sqlcipher.lib SQLITE3EXE=sqlcipher.exe LTLINKOPTS="C:\dev\OpenSSL\lib\VC\x64\MD\libcrypto.lib" OPT_FEATURE_FLAGS="-DSQLITE_EXTRA_INIT=sqlcipher_extra_init -DSQLITE_EXTRA_SHUTDOWN=sqlcipher_extra_shutdown -DSQLITE_TEMP_STORE=2 -DSQLITE_HAS_CODEC=1 -DSQLITE_ENABLE_FTS3=1 -DSQLITE_ENABLE_FTS5=1 -DSQLITE_ENABLE_FTS3_PARENTHESIS=1 -DSQLITE_ENABLE_STAT4=1 -DSQLITE_SOUNDEX=1 -DSQLITE_ENABLE_JSON1=1 -DSQLITE_ENABLE_GEOPOLY=1 -DSQLITE_ENABLE_RTREE=1 -DSQLCIPHER_CRYPTO_OPENSSL=1 -DSQLITE_MAX_ATTACHED=125 -IC:\dev\OpenSSL\include\x64"
          }
          mkdir sqlcipher
          copy sqlite3.h sqlcipher
          # Avoid the C2059 error.
          mv VERSION VERSION.txt

      - name: Configure build (SQLite)
        run: |
          mkdir release-sqlite && cd release-sqlite
          cmake -G "Ninja Multi-Config" -DCMAKE_PREFIX_PATH="C:\dev\OpenSSL;C:\dev\SQLite" -DOPENSSL_INCLUDE_DIR="$env:OPENSSL_INCLUDE_DIR" -DOPENSSL_CRYPTO_LIBRARY="C:\dev\OpenSSL\lib\VC\$env:OPENSSL_LIB_ARCH\MD\libcrypto.lib" -DOPENSSL_SSL_LIBRARY="C:\dev\OpenSSL\lib\VC\$env:OPENSSL_LIB_ARCH\MD\libssl.lib" -DENABLE_TESTING=ON ..\

      - name: Build (SQLite)
        run: |
          cd release-sqlite
          cmake --build . --config Release

      - name: Tests (SQLite)
        run: |
          cd release-sqlite
          ctest -C Release --output-on-failure

      - name: Configure build (SQLCipher)
        run: |
          mkdir release-sqlcipher && cd release-sqlcipher
          cmake -G "Ninja Multi-Config" -Dsqlcipher=1 -DCMAKE_PREFIX_PATH="C:\dev\OpenSSL;C:\dev\SQLCipher" -DOPENSSL_INCLUDE_DIR="$env:OPENSSL_INCLUDE_DIR" -DOPENSSL_CRYPTO_LIBRARY="C:\dev\OpenSSL\lib\VC\$env:OPENSSL_LIB_ARCH\MD\libcrypto.lib" -DOPENSSL_SSL_LIBRARY="C:\dev\OpenSSL\lib\VC\$env:OPENSSL_LIB_ARCH\MD\libssl.lib" -DENABLE_TESTING=ON ..\

      - name: Build (SQLCipher)
        run: |
          cd release-sqlcipher
          cmake --build . --config Release

      - name: Tests (SQLCipher)
        run: |
          cd release-sqlcipher
          ctest -C Release --output-on-failure

      # The prebuilt ICU binaries are built with Visual Studio 2022, so they need the VC143 runtime or newer.
      - if: github.event_name != 'pull_request'
        name: Resolve VC++ runtime DLLs
        run: |
          $VSPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -version "[17.0,18.0)" -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $CRTDir = Get-ChildItem "$VSPath\VC\Redist\MSVC\*\${{ matrix.arch }}\Microsoft.VC143.CRT" -Directory -ErrorAction SilentlyContinue | Sort-Object FullName | Select-Object -Last 1
          if ($null -eq $CRTDir) {
            throw "Could not locate the VC143 CRT DLLs for architecture '${{ matrix.arch }}'"
          }
          "VCRedistPath=$($CRTDir.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - if: github.event_name != 'pull_request'
        name: Create MSI
        env:
          ExePath: ${{ github.workspace }}
          ICUPath: C:\dev\ICU
          OpenSSLPath: C:\dev\OpenSSL
          SQLCipherPath: C:\dev\SQLCipher
          SqleanPath: ${{ github.workspace }}\sqlean
          SQLitePath: C:\dev\SQLite
        run: |
          cd installer/windows
          ./build.cmd ${{ matrix.arch }}
          $DATE=$(Get-Date -Format "yyyyMMdd")
          if ("${{ inputs.NIGHTLY }}" -eq "true") {
            mv DB.Browser.for.SQLite-*.msi "DB.Browser.for.SQLite-$DATE-win-${{ matrix.arch }}.msi"
          } else {
            mv DB.Browser.for.SQLite-*.msi "DB.Browser.for.SQLite-dev-$(git rev-parse --short HEAD)-win-${{ matrix.arch }}.msi"
          }

      - if: github.event_name != 'pull_request'
        name: Upload artifacts for code signing with SignPath
        id: unsigned-artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-artifacts-${{ matrix.os }}-win-${{ matrix.arch }}-unsigned
          path: installer\windows\DB.Browser.for.SQLite-*.msi
          retention-days: 1

      # Change the signing-policy-slug when you release an RC, RTM or stable release.
      - if: github.event_name != 'pull_request'
        name: Code signing with SignPath
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: "${{ secrets.SIGNPATH_API_TOKEN }}"
          github-artifact-id: "${{ steps.unsigned-artifacts.outputs.artifact-id }}"
          organization-id: "${{ secrets.SIGNPATH_ORGANIZATION_ID }}"
          output-artifact-directory: .\installer\windows
          project-slug: "sqlitebrowser"
          signing-policy-slug: "test-signing"
          wait-for-completion: true

      - if: github.event_name != 'pull_request'
        name: Create ZIP
        run: |
          $DATE=$(Get-Date -Format "yyyyMMdd")
          if ("${{ inputs.NIGHTLY }}" -eq "true") {
            $FILENAME_FORMAT="DB.Browser.for.SQLite-$DATE-win-${{ matrix.arch }}.zip"
          } else {
            $FILENAME_FORMAT="DB.Browser.for.SQLite-dev-$(git rev-parse --short HEAD)-win-${{ matrix.arch }}.zip"
          }
          Start-Process msiexec.exe -ArgumentList "/a $(dir installer\windows\DB.Browser.for.SQLite-*.msi) /q TARGETDIR=$PWD\target\" -Wait
          Compress-Archive -Path "target\DB Browser for SQLite\*" -DestinationPath $FILENAME_FORMAT

      - if: github.event_name != 'pull_request'
        name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-artifacts-win-${{ matrix.arch }}
          path: |
            installer\windows\DB.Browser.for.SQLite-*.msi
            DB.Browser.for.SQLite-*.zip
          retention-days: 1

      - name: Summary
        run: |
          if ("${{ matrix.arch }}" -eq "x86") {
            $OPENSSL_VERSION=(C:\dev\OpenSSL\bin\x86\openssl version) -replace "OpenSSL ([\d\.]+[a-z]+) .*", '$1'
          } else {
            $OPENSSL_VERSION=(C:\dev\OpenSSL\bin\x64\openssl version) -replace "OpenSSL ([\d\.]+[a-z]+) .*", '$1'
          }
          $QT_VERSION = & "$env:QT_ROOT_DIR\bin\qmake.exe" --version | Select-String "Using Qt version" | ForEach-Object { $_.ToString().Split()[3] }
          $SQLCIPHER_VERSION=(Get-Item "C:\dev\SQLCipher\sqlcipher.dll").VersionInfo.FileVersion
          Select-String -Path "C:\dev\SQLite\sqlite3.h" -Pattern '#define SQLITE_VERSION\s+"([\d\.]+)"' | ForEach-Object {
            ($_ -match '"([\d\.]+)"') | Out-Null
            $SQLITE_VERSION=$matches[1]
          }

          New-Item -ItemType Directory -Force -Path dependency-summary | Out-Null
          $SUMMARY_ROW = "| Build (Windows) | ${{ matrix.os }} / ${{ matrix.arch }} | $OPENSSL_VERSION | $QT_VERSION | $SQLCIPHER_VERSION | $SQLITE_VERSION |"
          Set-Content -Path "dependency-summary/dependencies-windows-${{ matrix.os }}-${{ matrix.arch }}.md" -Value $SUMMARY_ROW

      - name: Upload dependency summary
        uses: actions/upload-artifact@v7
        with:
          name: dependency-summary-windows-${{ matrix.os }}-${{ matrix.arch }}
          path: dependency-summary/*.md
          retention-days: 1

  summarize-dependencies:
    if: always() && inputs.CONSOLIDATE_DEPENDENCY_SUMMARY != true && !cancelled()
    needs: build
    name: Summarize Dependencies
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - name: Download dependency summaries
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: dependency-summary-*
          path: dependency-summary
          merge-multiple: true

      - name: Summary
        run: |
          {
            echo "## Dependencies used"
            echo ""
            echo "| Workflow | Target | OpenSSL | Qt | SQLCipher | SQLite |"
            echo "| :---: | :---: | :---: | :---: | :---: | :---: |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -d dependency-summary ] && find dependency-summary -type f -name '*.md' | grep -q .; then
            find dependency-summary -type f -name '*.md' -print | sort | while IFS= read -r file; do
              cat "$file" >> "$GITHUB_STEP_SUMMARY"
            done
          else
            echo "| Not available | No dependency summaries were uploaded. | - | - | - | - |" >> "$GITHUB_STEP_SUMMARY"
          fi

  release:
    if: github.event_name == 'workflow_dispatch' && github.workflow == 'Build (Windows)'
    needs: build
    name: Release
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/release.yml
