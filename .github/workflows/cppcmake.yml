name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "0 0 * * *"  # Every day at midnight UTC
  workflow_dispatch:
    inputs:
      NIGHTLY:
        description: "Run as a nightly build"
        default: false
        required: true
        type: boolean

run-name: >-
  ${{
    (github.event_name == 'schedule' || inputs.NIGHTLY == true)
      && 'Build and Deploy Nightly Builds'
      || github.event.pull_request.title
      || github.event.head_commit.message
      || format('{0} on {1}', github.workflow, github.ref_name)
  }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ (github.event_name == 'schedule' || inputs.NIGHTLY == true) && 'nightly' || 'continuous' }}
  cancel-in-progress: ${{ github.event_name != 'schedule' && inputs.NIGHTLY != true }}

jobs:
  check-skippable:
    name: Check Skippable
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      skip: ${{ steps.set-skippable.outputs.skippable || 'false' }}
      nightly-date: ${{ steps.nightly-date.outputs.date }}
    steps:
      - name: Set nightly date
        id: nightly-date
        run: echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7

      - name: Check and set skippable
        id: set-skippable
        continue-on-error: true
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            git fetch origin tag nightly
            LAST_COMMIT_HASH=$(git rev-list -n 1 nightly)
            if [ "$(git rev-parse HEAD)" = "$LAST_COMMIT_HASH" ]; then
              echo "::notice::No new commits since last nightly build, skipping this build."
              echo "skippable=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "skippable=false" >> "$GITHUB_OUTPUT"
          fi

  build-macos:
    needs: check-skippable
    if: needs.check-skippable.outputs.skip != 'true'
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/cppcmake-macos.yml
    secrets:
      MACOS_CODESIGN_APPLE_ID: ${{ secrets.MACOS_CODESIGN_APPLE_ID }}
      MACOS_CODESIGN_APPLE_PW: ${{ secrets.MACOS_CODESIGN_APPLE_PW }}
      MACOS_CODESIGN_DEV_ID: ${{ secrets.MACOS_CODESIGN_DEV_ID }}
      MACOS_CODESIGN_KEYCHAIN_PW: ${{ secrets.MACOS_CODESIGN_KEYCHAIN_PW }}
      MACOS_CODESIGN_P12: ${{ secrets.MACOS_CODESIGN_P12 }}
      MACOS_CODESIGN_P12_PW: ${{ secrets.MACOS_CODESIGN_P12_PW }}
      MACOS_CODESIGN_TEAM_ID: ${{ secrets.MACOS_CODESIGN_TEAM_ID }}
    with:
      NIGHTLY: ${{ github.event_name == 'schedule' || inputs.NIGHTLY == true }}
      NIGHTLY_DATE: ${{ needs.check-skippable.outputs.nightly-date }}
      CONSOLIDATE_DEPENDENCY_SUMMARY: true

  build-ubuntu:
    needs: check-skippable
    if: needs.check-skippable.outputs.skip != 'true'
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/cppcmake-ubuntu.yml
    with:
      NIGHTLY: ${{ github.event_name == 'schedule' || inputs.NIGHTLY == true }}
      NIGHTLY_DATE: ${{ needs.check-skippable.outputs.nightly-date }}
      CONSOLIDATE_DEPENDENCY_SUMMARY: true

  build-windows:
    needs: check-skippable
    if: needs.check-skippable.outputs.skip != 'true'
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/cppcmake-windows.yml
    secrets:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGNPATH_ORGANIZATION_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
    with:
      NIGHTLY: ${{ github.event_name == 'schedule' || inputs.NIGHTLY == true }}
      NIGHTLY_DATE: ${{ needs.check-skippable.outputs.nightly-date }}
      CONSOLIDATE_DEPENDENCY_SUMMARY: true

  summarize-dependencies:
    needs: [check-skippable, build-macos, build-ubuntu, build-windows]
    if: always() && needs.check-skippable.outputs.skip != 'true' && !cancelled()
    name: Summarize Dependencies
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/summarize-dependencies.yml

  release:
    if: github.event_name != 'pull_request'
    needs: [check-skippable, build-macos, build-ubuntu, build-windows]
    name: Release
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      NIGHTLY_DATE: ${{ needs.check-skippable.outputs.nightly-date }}
